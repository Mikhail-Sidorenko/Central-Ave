<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дом 88-96 — инженерные системы</title>
<style>
:root{
  --bg:#f6f5f1; --paper:#ffffff; --ink:#1d1d1b; --muted:#6b6a65; --line:#dcd9d0; --wall:#2b2a27;
  --ac:#0e7c9a; --rad:#d23a2a; --tp:#e8892b; --light:#b8860b; --sewer:#8a5a2b; --vent:#2f8f4e; --sel:#2453d6;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:grid;grid-template-columns:280px 1fr 340px;grid-template-rows:auto 1fr;height:100vh}
header{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:10px 16px;background:var(--paper);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.1px}
header .sub{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:4px;margin-left:auto;background:#eeece6;padding:3px;border-radius:9px}
.tabs button{border:0;background:transparent;padding:6px 14px;border-radius:7px;font:inherit;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:600}
aside{background:var(--paper);overflow:auto;padding:14px}
aside.left{border-right:1px solid var(--line)}
aside.right{border-left:1px solid var(--line)}
h2{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:14px 0 8px;font-weight:600}
h2:first-child{margin-top:0}
.layer{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;cursor:pointer;user-select:none}
.layer:hover{background:#f3f2ee}
.layer input{display:none}
.sw{width:30px;height:18px;border-radius:9px;background:#d9d6cd;position:relative;flex:none;transition:.15s}
.sw:after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.layer input:checked + .sw{background:var(--c)}
.layer input:checked + .sw:after{left:14px}
.layer .nm{flex:1}
.layer .cnt{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.legend{font-size:12px;color:var(--muted);display:grid;gap:6px;margin-top:4px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{display:inline-block;width:22px;height:0;border-top:2px solid var(--ink)}
.legend i.d{border-top-style:dashed}
.range{display:flex;align-items:center;gap:8px;padding:2px 8px 6px 48px;font-size:12px;color:var(--muted)}
.range input{flex:1}
main{position:relative;overflow:hidden;background:#fbfaf7}
svg#plan{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
svg#plan.drag{cursor:grabbing}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:34px;height:34px;border:1px solid var(--line);background:var(--paper);border-radius:8px;font-size:17px;cursor:pointer;color:var(--ink)}
.hint{position:absolute;left:12px;bottom:12px;font-size:12px;color:var(--muted);background:rgba(255,255,255,.85);padding:4px 8px;border-radius:6px}
.card h3{margin:0 0 2px;font-size:18px}
.card .meta{color:var(--muted);font-size:13px;margin-bottom:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;margin-bottom:12px}
.kv b{font-weight:500;color:var(--muted)}
.sec{border-top:1px solid var(--line);padding:10px 0}
.sec .t{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;margin-bottom:6px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.item{font-size:13px;margin:4px 0 4px 18px}
.item small{color:var(--muted)}
.badge{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:9px;margin-left:4px;vertical-align:1px;white-space:nowrap}
.b-project{background:#e4efe6;color:#1f6a36}
.b-decided{background:#e2ecf7;color:#1d4f8a}
.b-prelim{background:#f7ecd9;color:#8a5a12}
.warn{background:#fdf1ec;border-left:3px solid var(--rad);padding:6px 8px;font-size:12.5px;margin:6px 0 6px 18px;border-radius:0 6px 6px 0}
.empty{color:var(--muted);font-size:13px}
.open li{margin:0 0 7px;font-size:12.5px}
.open{padding-left:18px;margin:6px 0}
.note{font-size:12.5px;color:var(--muted);background:#f6f5f1;padding:8px;border-radius:8px;margin-top:8px}
.close{float:right;border:0;background:#f0eee8;border-radius:6px;padding:3px 8px;cursor:pointer;font:inherit;font-size:12px}
/* SVG */
.room{fill:#fff;stroke:none;cursor:pointer}
.room.out{fill:#f4f2ec}
.room.terrace{fill:#f6f3e8}
.room.tech{fill:#f7f7f5}
.room.wet{fill:#f2f7fa}
.room.stair{fill:#f5f4f0;cursor:default}
.room:hover{fill:#eef2fc}
.room.sel{fill:#e3eafc}
.rlab .nm{font-size:300px;fill:#3c3b37;font-weight:500}
.rlab .ar{font-size:250px;fill:var(--muted)}
svg.scanon .room{fill-opacity:.25}
svg.scanon .wall-e,svg.scanon .wall-i{opacity:.55}
svg.scanon .rlab{opacity:.85}
.rlab{pointer-events:none}
.wall-e{fill:#3a3935}
.wall-i{fill:#55534d}
.win{stroke:#7aa6c2;stroke-width:90;fill:none}
.winlab{font-size:150px;fill:#7a8c96}
.door{fill:#fbfaf7}
.axis{stroke:#b9b4a7;stroke-width:12;stroke-dasharray:240 60 40 60}
.axlab circle{fill:#fff;stroke:#9c978a;stroke-width:18}
.axlab text{font-size:260px;fill:#6b6a65;text-anchor:middle;dominant-baseline:central}
.dev text{font-size:200px;font-weight:600;dominant-baseline:central;text-anchor:middle;pointer-events:none}
.devlab{font-size:210px;fill:var(--ink);paint-order:stroke;stroke:#fbfaf7;stroke-width:60px;stroke-linejoin:round}
.prelim{stroke-dasharray:70 50}
g.dev{cursor:pointer}
.hide{display:none}
@media (max-width: 1000px){
  .app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto}
  aside.left{border-right:0;border-bottom:1px solid var(--line);padding:8px 10px;display:flex;flex-wrap:wrap;gap:2px}
  aside.left h2,aside.left .legend,aside.left .range,aside.left .opt{display:none}
  aside.left .layer{padding:4px 8px;font-size:13px}
  aside.left .layer .cnt{display:none}
  #layers{display:flex;flex-wrap:wrap;gap:2px}
  .hint{display:none}
  main{min-height:55vh}
  aside.right{border-left:0;border-top:1px solid var(--line);max-height:45vh}
  .tabs{margin-left:0}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div><h1>Дом 88-96 — инженерные системы</h1><div class="sub">Интерактивный план по проекту ООО «Движущая сила» · оси 13,90 × 16,13 м</div></div>
  <div class="tabs" id="tabs"></div>
</header>
<aside class="left">

    <div><span class="badge b-project">проект</span><span class="badge b-decided">решено</span><span class="badge b-prelim">предв.</span></div>
  </div>
</aside>
<main>

</main>
<aside class="right" id="panel"></aside>
</div>

const SYS = {
  ac:    { name: "Кондиционеры", c: "var(--ac)" },
  rad:   { name: "Радиаторы и котёл", c: "var(--rad)" },
  tp:    { name: "Тёплый пол", c: "var(--tp)" },
  light: { name: "Освещение и шторы", c: "var(--light)" },
  sewer: { name: "Канализация", c: "var(--sewer)" },
  vent:  { name: "Вентиляция", c: "var(--vent)" }
};
const ST = { project: ["b-project", "проект"], decided: ["b-decided", "решено"], prelim: ["b-prelim", "предв."] };
const badge = s => s ? `<span class="badge ${ST[s][0]}">${ST[s][1]}</span>` : "";
let floor = 1, selRoom = null;
const on = { ac: true, rad: true, tp: true, light: true, sewer: true, vent: true };
try { const s = JSON.parse(localStorage.getItem("dom8896") || "{}"); if (s.floor) floor = s.floor; if (s.on) Object.assign(on, s.on); } catch (e) {}
const save = () => { try { localStorage.setItem("dom8896", JSON.stringify({ floor, on })); } catch (e) {} };

const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("plan");
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const pts = p => p.map(q => q.join(",")).join(" ");
const roomById = id => ROOMS.find(r => r.id === id);
const centroid = p => { let x = 0, y = 0; p.forEach(q => { x += q[0]; y += q[1]; }); return [x / p.length, y / p.length]; };

// ---------- tabs & layers ----------
const tabs = document.getElementById("tabs");
FLOORS.forEach(f => { const b = document.createElement("button"); b.textContent = f.name; b.onclick = () => { floor = f.id; selRoom = null; save(); render(); }; b.dataset.f = f.id; tabs.appendChild(b); });
const layersBox = document.getElementById("layers");
Object.entries(SYS).forEach(([k, s]) => {
  const l = document.createElement("label"); l.className = "layer"; l.style.setProperty("--c", s.c);
  l.innerHTML = `<input type="checkbox" ${on[k] ? "checked" : ""}><span class="sw"></span><span class="nm">${s.name}</span><span class="cnt" id="cnt-${k}"></span>`;
  l.querySelector("input").onchange = e => { on[k] = e.target.checked; save(); applyLayers(); };
  layersBox.appendChild(l);
});
["scan", "labels", "axes"].forEach(id => document.getElementById(id).onchange = applyLayers);
document.getElementById("scanOp").oninput = applyLayers;

// ---------- view (pan/zoom) ----------
const FULL = { x: -3200, y: -3000, w: 19800, h: 22000 };
let vb = { ...FULL };
const setVB = () => svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
function fit() {
  const r = svg.getBoundingClientRect(), ar = r.width / Math.max(r.height, 1);
  const top = floor === 3 ? 1500 : -1500, bot = floor === 1 ? 17600 : 16300;
  let w = 19800, h = bot - top; const cx = 7300, cy = (top + bot) / 2;
  if (w / h > ar) h = w / ar; else w = h * ar;
  vb = { x: cx - w / 2, y: cy - h / 2, w, h }; setVB();
}
function zoom(k, px, py) {
  const r = svg.getBoundingClientRect();
  const fx = px === undefined ? .5 : (px - r.left) / r.width, fy = py === undefined ? .5 : (py - r.top) / r.height;
  const nw = Math.min(Math.max(vb.w * k, 2500), 60000), nh = vb.h * nw / vb.w;

  const vb2 = VENT.blocks.filter(b => b.floors.includes(r.f) && (b.rooms || []).includes(r.id));
  const vd = VENT.ducts.filter(d => d.f === r.f && pointIn(d.pts[0], r.poly));
  let vt = vg.map(x => `<div class="item">${x.lab} ${badge("project")}</div>`).join("") + vd.map(d => `<div class="item">${d.lab} ${badge("prelim")}</div>`).join("");
  if (vb2.length) vt += vb2.map(b => `<div class="item">Блок ${b.id}: ${b.ch.join(", ")} ${badge("project")}</div>`).join("");
  h += sec("vent", vt || `<div class="item empty">нет (естественный приток через окна)</div>`);
  h += `</div>`;
  panelEl.innerHTML = h;
}
function showDev(d) {
  let h = `<div class="card"><button class="close" onclick="panel()">✕</button><h3>${d.id || d.lab}</h3><div class="meta">${SYS[d.sys] ? SYS[d.sys].name : ""}</div>`;
  if (d.model) h += `<div class="item" style="margin-left:0">${d.model} ${badge(d.st)}</div>`;
  if (d.ch) h += `<div class="item" style="margin-left:0">Каналы: ${d.ch.join(", ")} ${badge(d.st)}</div><div class="note">${VENT.info}</div>`;
  if (d.info) h += `<div class="note">${d.info}</div>`;
  if (d.warn) h += `<div class="warn" style="margin-left:0">${d.warn}</div>`;
  panelEl.innerHTML = h + `</div>`;
}
function overview() {
  const f = FLOORS.find(x => x.id === floor);
  const rooms = ROOMS.filter(r => r.f === floor && r.kind !== "stair");
  let h = `<h2>${f.name} · отм. ${f.mark} · ${f.total}</h2><div class="empty">Нажмите на помещение, чтобы открыть карточку: площадь, оборудование, группа щита, зона отопления.</div>`;
  h += `<h2>Помещения</h2><div style="display:grid;gap:2px">` + rooms.map(r => `<div class="layer" style="padding:5px 8px" onclick="selectRoom('${r.id}')"><span class="nm">${r.n}. ${r.name}</span><span class="cnt">${r.area.toFixed(2).replace(".", ",")}</span></div>`).join("") + `</div>`;
  const acs = DEV.filter(d => d.sys === "ac" && d.t === "outdoor");
  h += `<h2>Наружные блоки</h2>` + acs.map(d => `<div class="item" style="margin-left:0;cursor:pointer" onclick='showDev(DEV.find(x=>x.id==="${d.id}"))'><b style="color:var(--ac)">${d.lab}</b> ${d.model} ${badge(d.st)}</div>`).join("");
  h += `<h2>Не размещено и открытые вопросы</h2><ul class="open">` + OPEN.map(o => `<li><span class="dot" style="--c:${SYS[o.sys].c};display:inline-block;width:8px;height:8px;margin-right:6px"></span>${o.t}</li>`).join("") + `</ul>`;
  h += `<div class="note">Источник геометрии — листы 3–5 и 16, 17.4–17.5 проекта 88-96 (сканы). Точность привязки около ±150 мм; включите «Скан чертежа», чтобы сверить. Оборудование кондиционирования — по вашей спецификации от 06.08.2026.</div>`;
  panelEl.innerHTML = h;
}
function pointIn([x, y], p) { let c = false; for (let i = 0, j = p.length - 1; i < p.length; j = i++) { const [xi, yi] = p[i], [xj, yj] = p[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c; } return c; }

render(); fit();
</script>
